[package]
name = "mosaic-desktop"
version = "0.0.1"
description = "MosAic for the Mac: the shell around the MosAic backend"
edition = "2021"
publish = false
license = "UNLICENSED"

[lib]
name = "mosaic_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2.8"
getrandom = "0.4"
ureq = { version = "3.4", default-features = false }
serde_json = "1"
log = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = "0.4"

[profile.release]
codegen-units = 1
lto = true
strip = true
