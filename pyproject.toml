[project]
name = "mosaic"
version = "0.0.1"
description = "MosAic: turns a folder of trip footage into story-driven edits."
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13",
    "anthropic>=1.11.0",
    "argon2-cffi>=25.1.0",
    "click>=8.1",
    "cryptography>=50.0.2",
    "fastapi>=0.142.2",
    "faster-whisper>=1.2.1",
    "filelock>=4.0",
    "huggingface-hub>=1.33.0",
    "keyring>=25.7.0",
    "numpy>=2.5.3",
    "pi-heif>=1.0",
    "pillow>=12.3.0",
    "platformdirs>=4.2",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "scipy>=1.18.1",
    "sqlalchemy>=2.0",
    "sqlite-vec>=0.1.9",
    "tokenizers>=0.23",
    "uvicorn>=0.30",
]

[project.scripts]
mosaic = "mosaic.cli.main:cli"
mosaic-dev = "mosaic.cli.dev:cli"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "hypothesis>=6.100",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/mosaic"]

[tool.uv]
python-preference = "managed"
# PyAV wheels bundle a GPL FFmpeg (x264/x265): never install it. faster-whisper imports it
# but MosAic decodes audio itself (ADR 0009, mosaic.audio.av_shim).
override-dependencies = ["av; sys_platform == 'never'"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "N"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
mypy_path = "backend"
packages = ["mosaic"]
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["mosaic.core.*", "mosaic.media.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs FFmpeg and generated synthetic media",
    "acceptance: milestone acceptance tests (slow)",
    "models: needs local ML model weights (Whisper, SigLIP)",
]
timeout = 900
