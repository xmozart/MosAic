[project]
name = "mosaic"
version = "0.0.1"
description = "MosAic: turns a folder of trip footage into story-driven edits."
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13",
    "click>=8.1",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "platformdirs>=4.2",
    "pydantic>=2.8",
    "sqlalchemy>=2.0",
]

[project.scripts]
mosaic = "mosaic.cli.main:cli"
mosaic-dev = "mosaic.cli.dev:cli"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/mosaic"]

[tool.uv]
python-preference = "managed"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "N"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
mypy_path = "backend"
packages = ["mosaic"]
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["mosaic.core.*", "mosaic.media.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs FFmpeg and generated synthetic media",
    "acceptance: milestone acceptance tests (slow)",
    "models: needs local ML model weights (Whisper, SigLIP)",
]
timeout = 900
