# MosAic shipped defaults (AGENT_WORKFLOW.md §4, ADR 0003). The owner's choices live in the
# control DB (user_preferences, provider_profile) and override these.

[settings]
"eval.corpus_dir" = ""
"analysis.mode" = "balanced"
"ai.budget.per_eval_run_usd" = 5.0
"ai.budget.per_milestone_usd" = 25.0
"ai.budget.per_job_usd" = 5.0
"ai.local_only" = false
"ai.send_gps" = false
"ai.cli.claude_path" = ""  # Claude Code app (claude-cli provider, ADR 0014); "" = find on PATH
"ai.cli.codex_path" = ""  # Codex app (codex-cli provider); "" = find on PATH
"ai.cli.timeout_s" = 300.0
"allow_gpl_ffmpeg" = false  # dev only; never enable in a shipped build

# capability → provider, model, mode. Anthropic is the default provider, not a requirement.
[providers.vision]
provider = "anthropic"
model = "claude-haiku-4-5"
mode = "cloud"

[providers.planner]
provider = "anthropic"
model = "claude-sonnet-5-5"
mode = "cloud"

[providers.selector]
provider = "anthropic"
model = "claude-sonnet-5-5"
mode = "cloud"

[providers.critic]
provider = "anthropic"
model = "claude-sonnet-5-5"
mode = "cloud"

[providers.reviewer]  # L3 Thorough review (AGENT_WORKFLOW §4: Sonnet 5.5)
provider = "anthropic"
model = "claude-sonnet-5-5"
mode = "cloud"

[providers.summarizer]  # day and trip summaries: short text, an economical model
provider = "anthropic"
model = "claude-haiku-4-5"
mode = "cloud"

[providers.transcriber]
provider = "faster-whisper"
model = "medium"
mode = "local"

[providers.embedder]
provider = "siglip-onnx"
model = "base"
mode = "local"

# `mosaic config ai use <preset>`: provider and model per AI capability in one step.
[presets.anthropic]
reviewer = "claude-sonnet-5-5"
summarizer = "claude-haiku-4-5"
vision = "claude-haiku-4-5"
planner = "claude-sonnet-5-5"
selector = "claude-sonnet-5-5"
critic = "claude-sonnet-5-5"

[presets.claude-cli]
reviewer = "claude-sonnet-5-5"
summarizer = "claude-haiku-4-5"
vision = "claude-haiku-4-5"
planner = "claude-sonnet-5-5"
selector = "claude-sonnet-5-5"
critic = "claude-sonnet-5-5"

[presets.codex-cli]
reviewer = "gpt-5.5"
summarizer = "gpt-5.5"
vision = "gpt-5.5"
planner = "gpt-5.5"
selector = "gpt-5.5"
critic = "gpt-5.5"
