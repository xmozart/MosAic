name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 120  # the 40-hour scale test runs in acceptance
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Cache FFmpeg and models
        uses: actions/cache@v4
        with:
          path: |
            .tools/ffmpeg
            ~/.local/share/MosAic/models
          key: tools-${{ runner.os }}-${{ hashFiles('scripts/fetch-ffmpeg-ci.sh') }}-whisper-small-536b066
      - name: LGPL FFmpeg (BtbN)
        run: test -x .tools/ffmpeg/bin/ffmpeg || make ffmpeg-ci
      - name: make ci
        run: make ci
