# Optional: NVIDIA GPUs for hardware video encoding (NVENC) and decoding.
# Needs the NVIDIA Container Toolkit on the host.
#   docker compose -f compose.yaml -f compose.nvidia.yaml up -d
services:
  mosaic:
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, video]
